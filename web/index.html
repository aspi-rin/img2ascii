<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Art</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>

  <div id="main">

    <!-- drop zone (visible before image is loaded) -->
    <div id="drop-zone">
      <div class="drop-inner">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect x="8" y="16" width="48" height="36" rx="4" stroke="#4da6ff" stroke-width="2"/>
          <circle cx="22" cy="28" r="4" stroke="#4da6ff" stroke-width="2"/>
          <path d="M8 40 L20 28 L30 38 L38 30 L56 40" stroke="#4da6ff" stroke-width="2" stroke-linejoin="round"/>
          <path d="M32 8 L32 2 M32 2 L28 6 M32 2 L36 6" stroke="#4da6ff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p class="drop-title">拖放图片到这里</p>
        <p class="drop-sub">或点击按钮选择文件</p>
        <button id="upload-btn" class="btn-primary">选择图片</button>
        <input type="file" id="file-input" accept="image/*" style="display:none" />
      </div>
    </div>

    <!-- split view (hidden until image is loaded) -->
    <div id="split-container">
      <div id="split-left" class="hidden">
        <div class="panel-label">
          ASCII
          <button id="show-preview-btn" class="panel-toggle-btn hidden" title="显示原图">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1 6.5C1 6.5 3 2.5 6.5 2.5S12 6.5 12 6.5 10 10.5 6.5 10.5 1 6.5 1 6.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="6.5" cy="6.5" r="1.8" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
        </div>
        <div class="scroll-area">
          <pre id="ascii-output"></pre>
        </div>
      </div>

      <div id="divider" class="hidden"></div>

      <div id="split-right" class="hidden">
        <div class="panel-label">
          原图
          <button id="hide-preview-btn" class="panel-toggle-btn" title="隐藏原图">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1 6.5C1 6.5 3 2.5 6.5 2.5S12 6.5 12 6.5 10 10.5 6.5 10.5 1 6.5 1 6.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="6.5" cy="6.5" r="1.8" stroke="currentColor" stroke-width="1.3"/><line x1="1.5" y1="1.5" x2="11.5" y2="11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="p5-container"></div>
      </div>
    </div>

  </div>

  <!-- controls bar -->
  <div id="controls" class="hidden">
    <div class="controls-left">
      <button id="upload-btn-2" class="btn-secondary">换图片</button>

      <div class="ctrl-group">
        <label>分辨率</label>
        <input type="range" id="cols-slider" min="30" max="500" value="100" step="1" />
        <span id="cols-value" class="val-badge">100</span>
      </div>

      <div class="ctrl-group">
        <label>对比度</label>
        <input type="range" id="contrast-slider" min="1" max="6" value="2.5" step="0.1" />
        <span id="contrast-value" class="val-badge">2.5</span>
      </div>

      <div class="ctrl-group">
        <label>字体大小</label>
        <input type="range" id="font-size-slider" min="6" max="20" value="11" step="1" />
        <span id="font-size-value" class="val-badge">11</span>
      </div>

      <div class="ctrl-group">
        <label>字符集</label>
        <select id="charset-select">
          <option value="all">全字符 (95)</option>
          <option value="classic">经典</option>
          <option value="minimal">简约</option>
          <option value="digits">数字符号</option>
        </select>
      </div>

      <div class="ctrl-group">
        <label>颜色</label>
        <div class="color-swatches" id="color-swatches">
          <button class="swatch active" data-color="#4da6ff"       style="background:#4da6ff"           title="默认蓝"></button>
          <button class="swatch"        data-color="rgb(249,172,200)" style="background:rgb(249,172,200)" title="粉红"></button>
          <button class="swatch"        data-color="rgb(245,95,139)"  style="background:rgb(245,95,139)"  title="玫红"></button>
          <button class="swatch"        data-color="rgb(230,104,92)"  style="background:rgb(230,104,92)"  title="珊瑚红"></button>
          <button class="swatch"        data-color="rgb(200,228,202)" style="background:rgb(200,228,202)" title="薄荷绿"></button>
          <button class="swatch"        data-color="rgb(215,206,150)" style="background:rgb(215,206,150)" title="麦黄"></button>
          <label class="swatch swatch-picker" title="自定义颜色">
            <input type="color" id="color-picker" value="#4da6ff" />
          </label>
        </div>
      </div>

      <label class="toggle-label">
        <input type="checkbox" id="invert-toggle" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        反转
      </label>
    </div>

    <div class="controls-right">
      <span id="status-msg" class="status-msg"></span>
      <button id="save-txt-btn" class="btn-secondary">保存 TXT</button>
      <button id="save-png-btn" class="btn-primary">保存 PNG</button>
    </div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
